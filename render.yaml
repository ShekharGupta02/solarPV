services:
  - type: web
    name: solarpv-ems-suite
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm --prefix server install && npm --prefix client install --include=dev && npm --prefix client run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
